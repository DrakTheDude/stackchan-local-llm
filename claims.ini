# What this project claims to be true, and how to find out cheaply.
#
# Run: ./tools/claimcheck/claimcheck.py -f claims.ini
#
# Every claim in here exists because the thing it protects went wrong ONCE and
# nothing noticed. That is the bar for adding one: not "this seems important",
# but "this broke silently and we found out days later".
#
# 🔴 KEEP THE PROOFS CHEAP. A proof that needs the robot awake, the stack up and
#    thirty seconds will get skipped, then commented out, then deleted. Grep a
#    built artifact where you can. `needs = docker` marks a claim as unchecked
#    rather than failed when the tooling is not here, which is a different and
#    more honest statement than a red cross.

# ─────────────────────────────────────────────────────────────── firmware build

[firmware: the binary is built for THIS board and chip]
why   = With no existing sdkconfig, ESP-IDF defaults the target to esp32 and the
        board choice falls through to a completely different device. The build
        SUCCEEDS and produces working firmware for the wrong hardware. v0.1.2
        shipped exactly that, and the only outward sign was an assets partition
        of 270KB instead of 1.6MB.
prove = grep -q '^CONFIG_BOARD_TYPE_M5STACK_STACKCHAN=y' firmware/sdkconfig &&
        grep -q '^CONFIG_IDF_TARGET="esp32s3"' firmware/sdkconfig
tag   = firmware
needs = test -f firmware/sdkconfig

[firmware: the OTA URL is ours, not the vendor cloud]
why   = The factory OTA endpoint is hardcoded to a vendor cloud service. A build
        that quietly reverts to it sends an always-on microphone and a camera to
        an undocumented endpoint, which is the entire reason this project exists.
# NOT grep -q: `absent` searches this command's OUTPUT, and -q prints none,
# so the tenclass check below would pass against any value at all.
prove = grep '^CONFIG_OTA_URL=' firmware/sdkconfig
absent = tenclass
tag   = firmware
needs = test -f firmware/sdkconfig

[firmware: exactly one wake word model is compiled in]
why   = The wake word model lives in generated_assets.bin on the assets
        partition, and the CMake rule that builds it does not depend on the SR
        config. Changing the wake word and flashing only the app leaves a build
        that looks correct and still listens for the old phrase.
prove = test "$(grep -cE '^CONFIG_SR_WN_.*=y' firmware/sdkconfig)" = "1"
tag   = firmware
needs = test -f firmware/sdkconfig

[firmware: the built binary is a plausible size]
why   = A wrong-chip or wrong-board build is a few hundred KB smaller and
        otherwise indistinguishable. This is the cheap tell that caught it in
        the wild, so it is worth asserting rather than eyeballing.
prove = test -f firmware/build/xiaozhi.bin &&
        test "$(stat -c%s firmware/build/xiaozhi.bin)" -gt 2500000
tag   = firmware
needs = test -f firmware/build/xiaozhi.bin

[firmware: the URL-fetching device tools are not in the build]
why   = Upstream registers upgrade_firmware, assets.set_download_url,
        screen.snapshot and screen.preview_image as "user only" - which keeps
        them out of tools/list, and then DoToolCall looks a tool up BY NAME and
        runs it with no user_only check anywhere. Hidden, not gated. On a device
        whose only input is a microphone, with no confirmation step, driven by a
        model that has invented a tool name unprompted, upgrade_firmware turns a
        spoken string into code execution and screen.snapshot uploads a picture
        of the screen to wherever the string points. Removed from this fork; a
        subtree update would put them back and nothing else would notice.
prove = ! strings firmware/build/xiaozhi.bin
        | grep -qE 'self[.](upgrade_firmware|assets[.]set_download_url|screen[.](snapshot|preview_image))'
needs = test -f firmware/build/xiaozhi.bin
tag   = firmware

[firmware: the default body and the steady mood are identities]
why   = Two axes, two identities. Every unit at 1.0 is what makes tokenising
        the face and the head safe: a
        robot nobody has touched behaves exactly as it did before any of it
        existed. Nudge one of those numbers - while tuning, or by copying the row
        to start a new character and editing the wrong one - and every robot on
        the default moves differently and is proportioned differently. Nothing
        errors, nothing logs, the instrument still traces its square, and the
        only symptom is that he feels slightly off to somebody not looking for it.
prove = grep -q 'Look{1.00f, 1.00f}}'
        firmware/main/boards/m5stack/stackchan/character.h
        && grep -q 'Motion{1.00f, 1.00f}}'
        firmware/main/boards/m5stack/stackchan/character.h
needs = test -f firmware/main/boards/m5stack/stackchan/character.h
tag   = firmware

[firmware: no head movement bypasses the character clamp]
why   = A character is data - from a table today, from a file or a network
        message tomorrow - so its motion unit is untrusted input. motion_unit 0
        would mean time_ms 0, which the servo API documents as "as fast as it
        likes": a head slamming pan and tilt into a mechanical stop, repeatedly,
        on a desk. character::MoveMs and PanDeg/TiltDeg clamp it. A gesture added
        later with a literal duration would work perfectly at the default
        character and only misbehave for somebody running a fast one - by ear,
        months later.
prove = ! tr '\n' ' ' < firmware/main/boards/m5stack/stackchan/stackchan_head.cc
        | grep -oE 'SetAngles[(][^;]*;'
        | grep -v 'character::'
        | grep -v 'float pan_deg'
needs = test -f firmware/main/boards/m5stack/stackchan/stackchan_head.cc
tag   = firmware

[firmware: the camera still exposes itself, rather than trusting the sensor]
why   = The sensor's own AEC stops at exposure 480 with the frame three stops
        under, and its gamma hides the problem by stretching a starved frame. The
        metering loop is the fix; losing it returns the camera to unusable while
        every test still "passes" because a photo is still produced.
prove = grep -q 'kMeterStill' firmware/main/boards/m5stack/stackchan/m5stack_stackchan.cc
tag   = firmware

# ──────────────────────────────────────────────────────────────── the patch kit

[server: the patch kit still applies to upstream]
why   = The patches are written against one exact upstream revision and every
        replacement asserts. This is what turns an upstream bump into a failed
        build instead of a silently restored bug. Never relax an assertion to
        get a build through.
prove = python3 -c "import ast,glob,sys; [ast.parse(open(f).read()) for f in glob.glob('server/patches/*.py')]"
tag   = server

[server: streamed replies do not lose the spaces between words]
why   = Upstream calls .rstrip() on every streamed chunk, which eats the space
        between words and turns spoken output into a run-on. Language-neutral,
        invisible in a transcript, obvious out loud.
prove = grep -q 'rstrip' server/patches/upstream-fixes.py
tag   = server

[server: a URL cannot be read aloud one fragment at a time]
why   = The markdown cleaner removes links, but it runs AFTER sentence
        segmentation and after punctuation stripping - so a link gets cut apart
        at the dots in a domain, or loses the leading bracket the regex anchors
        on, and the fragments go to the speaker. Heard twice.
prove = grep -q 'scan_text' server/patches/english-pass.py &&
        grep -q 'clean_markdown(segment_text_raw)' server/patches/upstream-fixes.py
tag   = server

[server: the model's tool-call token never reaches the speaker]
why   = mistral-nemo emits Mistral's [TOOL_CALLS] marker as ordinary text
        whenever it calls a tool, and it was spoken aloud on every greeting -
        reported as the robot making up a name.
prove = grep -q 'TOOL_CALLS' server/patches/upstream-fixes.py
tag   = server

# ───────────────────────────────────────────────────────── privacy and secrets

[server: an idle close does not ask the robot for a new session]
why   = `tts stop` means "your turn" and the firmware acts on it - in the default
        auto-listening mode it leaves Speaking for Listening, which OPENS A NEW
        AUDIO CHANNEL. Sending it and then closing told the robot to start a
        fresh session and hung up in the same breath, so it reconnected, greeted
        the room and listened, and the idle timeout never put it to sleep. It
        read as friendliness rather than a fault: nothing errored, nothing warned,
        and the only symptom was a robot that would not settle.
prove = grep -q 'ABOUT TO CLOSE' server/patches/upstream-fixes.py
tag   = server

[repo: no private network addresses are committed]
why   = This repository is public. A LAN address published with a bench result
        is a leak nobody intended, and it happened - seven result files carried
        the machine they were measured against. Scoped to the files we write:
        the vendored upstream tree carries its own example addresses, and
        docs/privacy.md documents the robot's own 192.168.4.1 setup page.
prove = ! git grep -nE '192\.168\.[0-9]+\.[0-9]+' --
        tools/ server/ deploy/ docs/ README.md CLAUDE.md firmware/main/boards/
        ':!claims.ini' ':!docs/privacy.md'
tag   = privacy

[repo: no credentials are committed]
why   = Tokens belong in an env var or a gitignored file, never in the repo, and
        the build tree is public - a token in a header here would not merely be
        committed, it would be published.
prove = ! git grep -nE '(Bearer [A-Za-z0-9_]{12,}|api[_-]?key["'\'' ]*[:=]["'\'' ]*[A-Za-z0-9]{16,})' -- .
tag   = privacy

[repo: the build directory is not tracked]
why   = firmware/build holds a generated sdkconfig.h containing whatever server
        address the builder configured. It is gitignored; if that ever lapses,
        every contributor publishes their own network.
prove = test -z "$(git ls-files firmware/build)"
tag   = privacy

# ──────────────────────────────────────────────────────────── the running stack

[stack: the ASR model the config asks for is one the ASR container has]
why   = speaches does not download on demand - it serves what is cached and 404s
        everything else. Point the config at a model that was never pulled and
        the container starts cleanly, reports its device, logs no errors, and
        fails every single transcription. The only symptom is a robot that has
        stopped hearing you, which reads as a microphone fault or a wake-word
        problem. It happened, and it took a log nobody was watching to find.
prove = docker exec xiaozhi sh -c "grep -A4 'WhisperLocal:' data/.config.yaml
        | grep model_name | sed 's/.*: //'" > /tmp/cc_want
        && docker exec whisper curl -s localhost:8000/v1/models
        | grep -qf /tmp/cc_want
needs = docker inspect whisper
tag   = stack

[stack: the server container is running our derived image]
why   = The stock upstream image speaks Chinese in places no prompt can reach and
        carries the bugs the patch kit fixes. Running it instead of the derived
        one looks fine until the robot says something nobody can read.
prove = docker ps --format '{{.Image}}' | grep -q 'xiaozhi-esp32-server'
needs = docker inspect xiaozhi
tag   = stack

[stack: the patches are live in the running container, not just on disk]
why   = A patch kit that is committed but not rebuilt is the same silent success
        as a binary that is built but not flashed. Check the thing that is
        actually running.
prove = docker exec xiaozhi grep -q 'scan_text' core/providers/tts/base.py
needs = docker inspect xiaozhi
tag   = stack
