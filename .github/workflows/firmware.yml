# Build the firmware, and publish it when a version tag is pushed.
#
# 🔴 WHAT MAKES A RELEASE BINARY SAFE TO HAND OUT: there is no
#    sdkconfig.defaults.local here, so CONFIG_OTA_URL stays the
#    `stackchan-server.invalid` placeholder. `.invalid` is a reserved name that
#    can never resolve, so a robot flashed from a release dials NOBODY until its
#    owner sets an address on the robot itself. A build that quietly baked in
#    somebody's server would be the worst possible thing to publish, so the job
#    below checks for that rather than trusting it.
#
# The build runs through deploy/build.sh for the same reason humans do: a plain
# `idf.py build` silently builds a different board with upstream's cloud OTA URL.

name: firmware

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["firmware/**", "deploy/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: write        # the release step
  pages: write           # the flasher page
  id-token: write        # deploy-pages requires this

jobs:
  build:
    runs-on: ubuntu-latest
    # Pinned to the version this project is developed against. ESP-IDF minor
    # releases move fast and the board's audio and camera paths are sensitive to
    # component versions; bumping this is a deliberate change with a hardware
    # test after it, not a convenience.
    container: espressif/idf:v6.0.2

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          # `bash deploy/build.sh`, not `deploy/build.sh`. The executable bit is
          # recorded in git and correct - but CI should not fail on a file
          # permission, and a re-run of an older commit replays that commit's
          # tree, so a mode fix cannot rescue a run that started before it.
          # Humans still run it directly, which is why the bit matters too.
          bash deploy/build.sh

      - name: Merge into one image, for a deliberate clean install
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" >/dev/null
          cd firmware/build
          # 🔴 THIS IMAGE ERASES NVS, AND THAT IS NOT WHAT MOST PEOPLE WANT.
          #
          #    A merged image spans 0x0 to the end of the assets partition and
          #    pads every gap with 0xFF - and NVS lives at 0x9000-0xD000, in one
          #    of those gaps. Writing it therefore wipes the robot's Wi-Fi, its
          #    server address, and its FACTORY SERVO CALIBRATION, which is
          #    per-unit and cannot be recovered once it is gone.
          #
          #    So it is published as a deliberate clean-slate option, and the
          #    browser flasher does NOT use it - that writes each part at its own
          #    offset so the gaps are left alone.
          #
          # ⚠️ esptool with explicit offsets, NOT `idf.py merge-bin`. That target
          #    triggers a full reconfigure, and a reconfigure is exactly where
          #    this project's component resolution has been seen to fall over -
          #    it broke a working tree once already. The offsets are the ones the
          #    build itself reports in flash_args; if they ever change, this step
          #    is where it should be noticed.
          esptool --chip esp32s3 merge-bin \
            -o stackchan-local-llm-merged.bin \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x0 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0xd000 ota_data_initial.bin \
            0x20000 xiaozhi.bin \
            0x800000 generated_assets.bin

      - name: Refuse to publish a binary pointing at somebody's server
        shell: bash
        run: |
          set -euo pipefail

          # 🔴 THE BOARD AND THE CHIP, FIRST. v0.1.2 was published as an ESP32
          #    build of a bread-board reference design, because a clean checkout
          #    has no sdkconfig and IDF then defaults the target to esp32. Every
          #    other check below passed on it, including the OTA URL - which
          #    comes from the defaults file whatever board is selected, and so
          #    could never have caught this.
          target=$(grep -oP 'CONFIG_IDF_TARGET="\K[^"]+' firmware/sdkconfig)
          board=$(grep -oE '^CONFIG_BOARD_TYPE_[A-Z0-9_]+=y' firmware/sdkconfig | head -1)
          echo "target: $target"
          echo "board:  $board"
          [ "$target" = "esp32s3" ] || { echo "::error::Wrong chip: $target"; exit 1; }
          [ "$board" = "CONFIG_BOARD_TYPE_M5STACK_STACKCHAN=y" ] \
            || { echo "::error::Wrong board: $board"; exit 1; }

          url=$(grep -oP 'CONFIG_OTA_URL="\K[^"]+' firmware/sdkconfig)
          echo "built-in OTA URL: $url"
          case "$url" in
            *.invalid*) echo "placeholder, as it must be" ;;
            *) echo "::error::Release binary has a real OTA URL baked in: $url"; exit 1 ;;
          esac
          # And nothing should have crept in from a developer's machine.
          if grep -rqE '192\.168\.[0-9]+\.[0-9]+' firmware/sdkconfig; then
            echo "::error::sdkconfig contains a LAN address"; exit 1
          fi

      # 🔴 A BINARY THAT BUILDS IS NOT A BINARY THAT WORKS, and the first release
      #    proved it: v0.1.2 compiled, passed every check, published, and could
      #    not be woken by voice. Its assets partition was 270KB of one font
      #    where it should have been 1.6MB including the wake-word model, because
      #    three options lived only in a developer's gitignored sdkconfig.
      #
      #    Nothing in a compile can catch that. So the artefacts are inspected
      #    for the things that make this robot a robot, and the job fails if they
      #    are absent - which is cheaper than a stranger concluding their
      #    microphone is broken.
      - name: Assert the firmware can actually do its job
        shell: bash
        run: |
          set -euo pipefail
          A=firmware/build/generated_assets.bin

          # 🔴 `strings "$A" | grep -q PATTERN` IS A BROKEN CHECK, and it fails
          #    in the direction that reads as a real defect.
          #
          #    grep -q exits the moment it matches and closes the pipe. strings
          #    is still writing, so it takes SIGPIPE and dies with 141 - and
          #    `pipefail` makes THAT the pipeline's status, not grep's 0. A match
          #    therefore reports as a miss.
          #
          #    And it is size-dependent, which is the cruel part: when the output
          #    fits in the pipe buffer strings finishes before grep exits and the
          #    check passes. Measured on this project's own artefacts:
          #
          #      1.6MB  (correct)  strings | grep -q  -> exit 141   "missing"
          #      200KB  (a slice)  strings | grep -q  -> exit 0     "present"
          #
          #    So it passes on a wrong, small assets partition and fails on the
          #    right one. It blocked v0.1.3, which was correct.
          #
          #    Dump once, then grep the dump. No pipeline, nothing to kill.
          strings -n 5 "$A" > /tmp/assets.txt

          # ⚠️ And prove the reader produced something before believing anything
          #    it reports absent. An unreadable artefact would otherwise fail
          #    every assertion below with a message about the wrong thing.
          if [ ! -s /tmp/assets.txt ]; then
            echo "::error::Read no strings out of $A ($(stat -c %s "$A" 2>/dev/null || echo no) bytes)"
            echo "::error::Every check below would be a false negative, so stopping here instead"
            exit 1
          fi

          if ! grep -qiE 'histackchan|wn9l' /tmp/assets.txt; then
            echo "::error::No wake-word model in the assets partition - the robot would never hear its name"
            echo "assets contains:"; grep -iE '\.(bin|png|json)$' /tmp/assets.txt | sort -u | head
            exit 1
          fi
          # Print what MATCHED, not the first wn9-ish string in the file - the
          # dump contains other models' data blobs and naming one of those in a
          # green log is how you end up sure of a wake word you are not shipping.
          echo "wake-word model present:$(grep -oiE '[a-z0-9_]*(histackchan|wn9l)[a-z0-9_]*' /tmp/assets.txt | sort -u | sed 's/^/ /' | tr -d '\n')"

          # The face is drawn from these. A build without them is not broken, but
          # it is not this project either.
          if ! grep -q 'happy.png' /tmp/assets.txt; then
            echo "::error::No emotion assets - the face would have nothing to show"
            exit 1
          fi
          echo "face assets present"

          # A blunt floor, caught in the one case that mattered: the bad build was
          # 270KB. Anything near that is missing most of itself.
          size=$(stat -c %s "$A")
          echo "assets partition: $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::Assets partition is only $size bytes; a complete one is ~1.6MB"
            exit 1
          fi

      - name: Collect artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cd firmware
          cp build/xiaozhi.bin build/bootloader/bootloader.bin \
             build/partition_table/partition-table.bin build/ota_data_initial.bin \
             build/generated_assets.bin \
             build/stackchan-local-llm-merged.bin ../out/
          cd ../out
          sha256sum * > SHA256SUMS
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/

      # 🔴 THE BINARIES ARE SERVED FROM THE PAGES SITE, NOT FROM THE RELEASE.
      #
      #    GitHub release downloads send NO Access-Control-Allow-Origin header -
      #    measured, on the real asset, after the browser flasher failed with
      #    "NetworkError when attempting to fetch resource". So a page on
      #    github.io cannot fetch them, however correct the URLs are.
      #
      #    Pages does send `access-control-allow-origin: *`, so the firmware
      #    ships alongside the flasher page and the manifest uses RELATIVE paths.
      #    Same origin, no CORS to satisfy.
      #
      # ⚠️ Built as an artefact rather than committed. Ten megabytes per release
      #    in git history would be permanent, and none of it is source.
      - name: Assemble the flasher site
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          # ⚠️ INTO site/flash/, NOT site/. The artifact becomes the whole site,
          #    so anything at its root is served at "/" - and the flasher already
          #    lives at /flash/, which is the URL in the README, in the release
          #    notes and in anything anyone has bookmarked. Keeping the path is
          #    not tidiness; moving it silently breaks every link to it.
          mkdir -p site/flash
          cp docs/flash/index.html docs/flash/manifest.json site/flash/
          # Everything the manifest names, and nothing else. The merged image is
          # deliberately NOT here: it erases NVS, and it has no business being
          # one click away.
          cp out/bootloader.bin out/partition-table.bin out/ota_data_initial.bin \
             out/xiaozhi.bin out/generated_assets.bin site/flash/

          # Something at the root, so "/" is not a 404 that looks like a broken
          # deployment. Also the honest place to say what this site is for.
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>StackChan local LLM</title>
          <meta http-equiv="refresh" content="0; url=flash/">
          <body style="background:#000;color:#C9A9FF;font:16px system-ui;padding:40px">
          <p>This site hosts the browser flasher for
          <a style="color:#A17EFF" href="https://github.com/DrakTheDude/stackchan-local-llm">stackchan-local-llm</a>.</p>
          <p><a style="color:#A17EFF" href="flash/">Go to the flasher</a></p>
          </body>
          HTML

          find site -type f | sed 's|^|  |'

      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: site

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Flashing

            **The app only** (keeps your Wi-Fi, your server address and your robot's
            factory servo calibration — all of which live in NVS):

                esptool --chip esp32s3 -p PORT write-flash 0x20000 xiaozhi.bin

            **Everything**, for a robot that has never run this firmware:

                esptool --chip esp32s3 -p PORT write-flash \
                  0x0 bootloader.bin \
                  0x8000 partition-table.bin \
                  0xd000 ota_data_initial.bin \
                  0x20000 xiaozhi.bin \
                  0x800000 generated_assets.bin

            🔴 **`stackchan-local-llm-merged.bin` is not the same thing.** It is one
            image written at `0x0`, and it **erases NVS** — your Wi-Fi, your server
            address, and your robot's **factory servo calibration**, which is unique
            to your unit and cannot be recovered. Use it only for a deliberate clean
            slate. The commands above, and the browser flasher, leave NVS alone.

            🔴 **Back up your factory firmware first.** M5Stack do not publish it, so
            without a backup "put it back" stops being an option you have. See
            [the quickstart](docs/quickstart.md).

            ## After flashing

            This binary does not know where your server is, deliberately — it ships
            pointing at an address that cannot resolve. On first boot the robot serves
            a setup network called **StackChan-XXXX**: join it, give it your Wi-Fi, and
            put your server address under **Advanced → Custom OTA URL**.

            To change it later, hold a finger on his screen for **five seconds**.

  # Separate job because deploy-pages must run on its own, with the Pages
  # environment attached. It publishes what the build assembled: the flasher page
  # and the exact binaries this tag produced, together, so the page can never
  # offer a firmware that is not the one beside it.
  pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
